<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="glass">
    <h2 class="title mb-4"><i class="bi bi-journal-plus me-2"></i>Add Book</h2>

    <form action="addBook" method="post">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-book"></i></span>
        <input type="text" name="bname" class="form-control" placeholder="Book Name" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="author" class="form-control" placeholder="Author" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-tags"></i></span>
        <input type="text" name="btype" class="form-control" placeholder="Book Type" required>
      </div>
      <div class="input-group mb-4">
        <span class="input-group-text"><i class="bi bi-currency-rupee"></i></span>
        <input type="number" step="0.01" name="price" class="form-control" placeholder="Price" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-grad b1"><i class="bi bi-check-circle me-2"></i>Add Book</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="text-decoration-none fw-semibold"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</body>
</html>
